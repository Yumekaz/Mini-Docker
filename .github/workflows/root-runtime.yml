name: Root Runtime Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: root-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  root-runtime:
    name: Root-mode runtime smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      STATE_BASE: /tmp/mini-docker-root-runtime
      MINI_DOCKER_ROOT: /tmp/mini-docker-root-runtime/root
      MINI_DOCKER_RUN: /tmp/mini-docker-root-runtime/run
      SMOKE_ROOTFS: /tmp/mini-docker-root-runtime/rootfs
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve Python runtime
        run: |
          set -euo pipefail
          python -m pip install pytest
          python -m mini_docker --help > /dev/null
          echo "PYTHON_BIN=$(command -v python)" >> "$GITHUB_ENV"

      - name: Prepare static disposable BusyBox rootfs
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y busybox-static iproute2 iptables strace
          mkdir -p rootfs/{bin,dev,proc,sys,tmp,etc}
          cp /usr/bin/busybox rootfs/bin/busybox
          for applet in sh echo cat sleep dd mkdir rmdir sync httpd printf; do ln -sf busybox "rootfs/bin/$applet"; done

      - name: Prepare isolated runtime paths
        run: |
          set -euo pipefail

          require_tmp_path() {
            case "$1" in
              /tmp/mini-docker-root-runtime|/tmp/mini-docker-root-runtime/*) ;;
              *)
                echo "::error::Refusing to touch unsafe path: $1"
                exit 1
                ;;
            esac
          }

          require_tmp_path "$STATE_BASE"
          require_tmp_path "$MINI_DOCKER_ROOT"
          require_tmp_path "$MINI_DOCKER_RUN"
          require_tmp_path "$SMOKE_ROOTFS"

          test "$MINI_DOCKER_ROOT" != "/var/lib/mini-docker"
          test "$MINI_DOCKER_RUN" != "/var/run/mini-docker"
          test -x rootfs/bin/busybox
          test -x rootfs/bin/sh

          sudo rm -rf -- "$STATE_BASE"
          mkdir -p "$STATE_BASE"
          cp -a rootfs "$SMOKE_ROOTFS"
          mkdir -p "$MINI_DOCKER_ROOT" "$MINI_DOCKER_RUN"
          sudo chown -R root:root "$STATE_BASE"
          sudo chmod 700 "$STATE_BASE" "$MINI_DOCKER_ROOT" "$MINI_DOCKER_RUN"

      - name: Verify privileged Ubuntu runner
        run: |
          set -euo pipefail
          sudo --non-interactive true
          test "$(sudo --non-interactive id -u)" = "0"
          command -v unshare
          command -v mount
          command -v chroot
          command -v ip
          command -v iptables
          command -v strace
          command -v timeout
          test -e /proc/self/ns/mnt
          test -e /sys/fs/cgroup/cgroup.controllers

      - name: Complete privileged runtime suite without prerequisite skips
        id: required_suite
        run: |
          set -euo pipefail
          mkdir -p verification/source-before
          git rev-parse HEAD > verification/revision.txt
          python --version 2>&1 | tee verification/python-version.txt
          uname -a > verification/kernel-version.txt
          cp --parents tests/test_linux_runtime_integration.py .github/workflows/root-runtime.yml \
            mini_docker/container.py mini_docker/filesystem.py \
            mini_docker/process_identity.py mini_docker/seccomp.py verification/source-before/
          sha256sum tests/test_linux_runtime_integration.py .github/workflows/root-runtime.yml \
            mini_docker/container.py mini_docker/filesystem.py \
            mini_docker/process_identity.py mini_docker/seccomp.py > verification/source-before.sha256
          sudo --non-interactive env PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m pytest -q -p no:cacheprovider \
            --junitxml="$GITHUB_WORKSPACE/verification/root-results.xml" \
            tests/test_linux_runtime_integration.py 2>&1 | tee verification/root-suite.log
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root=ET.parse('verification/root-results.xml').getroot()
          assert len(root.findall('.//testcase'))>=16
          names={case.attrib.get('name') for case in root.findall('.//testcase')}
          required={'test_private_devices_and_nodev_image_volume_and_submount',
                    'test_readonly_proc_and_private_inert_control_masks',
                    'test_required_mount_failure_never_falls_back_or_execs[private]',
                    'test_required_mount_failure_never_falls_back_or_execs[detach]'}
          assert required <= names, f'missing required isolation cases: {required-names}'
          assert any(case.attrib.get('name')=='test_verified_pidfd_stop_and_exec_use_owned_container' for case in root.findall('.//testcase'))
          assert not root.findall('.//skipped'), 'required privileged runtime cases were skipped'
          PY

      - name: Diagnose rootexec only after required suite failure (not an acceptance rerun)
        if: ${{ failure() && steps.required_suite.outcome == 'failure' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          # Never reuse the original suite's pytest/state paths or /var runtime.
          test "$STATE_BASE" = /tmp/mini-docker-root-runtime
          diagnostic_state_base="$(sudo --non-interactive mktemp -d "$STATE_BASE/rootexec-diagnostic.XXXXXX")"
          case "$diagnostic_state_base" in
            "$STATE_BASE"/rootexec-diagnostic.*) ;;
            *) echo '::error::Unsafe diagnostic state path'; exit 1 ;;
          esac
          sudo --non-interactive chmod 700 "$diagnostic_state_base"
          diagnostic_logs="$GITHUB_WORKSPACE/verification/rootexec-diagnostic"
          mkdir -p "$diagnostic_logs"
          printf '%s\n' "$diagnostic_state_base" > "$diagnostic_logs/state-base.txt"
          # The test's 30s subprocess and existing stop deadlines are unchanged.
          # This extra 60s whole-command bound covers tracing/setup overhead.
          if sudo --non-interactive timeout --signal=TERM --kill-after=5s 60s \
            strace -ff -tt -T -s 256 -yy -o "$diagnostic_logs/syscalls" \
            env STATE_BASE="$diagnostic_state_base" \
              MINI_DOCKER_ROOT="$diagnostic_state_base/root" \
              MINI_DOCKER_RUN="$diagnostic_state_base/run" \
              PYTHONPATH="$GITHUB_WORKSPACE" \
              "$PYTHON_BIN" -m pytest -q -s -p no:cacheprovider \
              --basetemp="$diagnostic_state_base/pytest" \
              --junitxml="$diagnostic_logs/rootexec-results.xml" \
              tests/test_linux_runtime_integration.py::test_verified_pidfd_stop_and_exec_use_owned_container \
            2>&1 | tee "$diagnostic_logs/rootexec.log"; then
            diagnostic_status=0
          else
            diagnostic_status=$?
          fi
          printf '%s\n' "$diagnostic_status" > "$diagnostic_logs/exit-status.txt"
          sudo --non-interactive chown -R "$(id -u):$(id -g)" "$diagnostic_logs"
          # Only diagnostic status: required_suite has already failed the job.
          exit "$diagnostic_status"

      - name: Run root host doctor
        run: |
          set -euo pipefail
          set +e
          sudo --non-interactive env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker doctor --rootfs "$SMOKE_ROOTFS" \
            | tee "$RUNNER_TEMP/root-doctor.txt"
          doctor_status=${PIPESTATUS[0]}
          set -e

          if [ "$doctor_status" -eq 2 ]; then
            echo "::warning::Root doctor reported warnings; continuing with smoke validation."
          elif [ "$doctor_status" -ne 0 ]; then
            exit "$doctor_status"
          fi

      - name: Assert root doctor safety report
        run: |
          set -euo pipefail
          set +e
          sudo --non-interactive env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker doctor \
              --rootfs "$SMOKE_ROOTFS" \
              --format json > "$RUNNER_TEMP/root-doctor.json"
          doctor_status=$?
          set -e

          if [ "$doctor_status" -ne 0 ] && [ "$doctor_status" -ne 2 ]; then
            exit "$doctor_status"
          fi

          python - <<'PY'
          import json
          import os
          import sys

          with open(os.path.join(os.environ["RUNNER_TEMP"], "root-doctor.json")) as f:
              report = json.load(f)

          if report["mode"] != "root":
              raise SystemExit(f"expected root doctor mode, got {report['mode']!r}")

          failures = [c for c in report["checks"] if c["status"] == "fail"]
          if failures:
              for check in failures:
                  print(f"{check['name']}: {check['detail']}", file=sys.stderr)
              raise SystemExit("root doctor reported failing checks")

          state_base = os.environ["STATE_BASE"]
          for name in ("MINI_DOCKER_ROOT", "MINI_DOCKER_RUN", "SMOKE_ROOTFS"):
              path = os.environ[name]
              if not path.startswith(state_base + "/"):
                  raise SystemExit(f"{name} escaped isolated state path: {path}")

          touched = {item["resource"] for item in report["host_touches"]}
          forbidden = {"/var/lib/mini-docker", "/var/run/mini-docker"}
          leaked = sorted(touched & forbidden)
          if leaked:
              raise SystemExit(f"doctor reported unsafe host paths: {leaked}")
          PY

      - name: Run root-mode smoke workload
        run: |
          set -euo pipefail
          sudo --non-interactive unshare --mount --propagation private -- env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker run \
              --no-overlay \
              "$SMOKE_ROOTFS" \
              /bin/echo mini-docker-root-smoke \
            | tee "$RUNNER_TEMP/root-run.txt"

          grep -q "mini-docker-root-smoke" "$RUNNER_TEMP/root-run.txt"
          container_id="$(awk '/Created container:/ {print $3}' "$RUNNER_TEMP/root-run.txt" | tail -n 1)"
          test -n "$container_id"
          echo "CONTAINER_ID=$container_id" >> "$GITHUB_ENV"

      - name: Verify metadata and logs
        run: |
          set -euo pipefail
          sudo --non-interactive env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker ps -a --format json \
            > "$RUNNER_TEMP/root-ps.json"

          python - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "root-ps.json")) as f:
              containers = json.load(f)

          container_id = os.environ["CONTAINER_ID"]
          matches = [c for c in containers if c["id"].startswith(container_id)]
          if len(matches) != 1:
              raise SystemExit(f"expected one container for {container_id}, got {len(matches)}")

          container = matches[0]
          if container["status"] != "stopped":
              raise SystemExit(f"expected stopped container, got {container['status']}")
          if container.get("exit_code") not in (0, None):
              raise SystemExit(f"unexpected exit code: {container.get('exit_code')}")
          if container.get("rootless"):
              raise SystemExit("root smoke container was marked rootless")
          PY

          sudo --non-interactive env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker logs "$CONTAINER_ID" \
            | tee "$RUNNER_TEMP/root-logs.txt"
          grep -q "mini-docker-root-smoke" "$RUNNER_TEMP/root-logs.txt"

      - name: Remove smoke container
        run: |
          set -euo pipefail
          sudo --non-interactive env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker rm "$CONTAINER_ID"

          sudo --non-interactive env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker ps -a --format json \
            > "$RUNNER_TEMP/root-ps-after-rm.json"

          python - <<'PY'
          import json
          import os

          with open(os.path.join(os.environ["RUNNER_TEMP"], "root-ps-after-rm.json")) as f:
              containers = json.load(f)

          container_id = os.environ["CONTAINER_ID"]
          if any(c["id"].startswith(container_id) for c in containers):
              raise SystemExit(f"container still exists after rm: {container_id}")
          PY

      - name: Verify runtime cleanup dry-run
        run: |
          set -euo pipefail
          sudo --non-interactive env \
            MINI_DOCKER_ROOT="$MINI_DOCKER_ROOT" \
            MINI_DOCKER_RUN="$MINI_DOCKER_RUN" \
            PYTHONPATH="$GITHUB_WORKSPACE" \
            "$PYTHON_BIN" -m mini_docker cleanup --runtime --dry-run --force \
            | tee "$RUNNER_TEMP/root-cleanup-dry-run.txt"

          grep -q "Runtime cleanup (planned):" "$RUNNER_TEMP/root-cleanup-dry-run.txt"
          grep -q "cleanup-nat" "$RUNNER_TEMP/root-cleanup-dry-run.txt"
          grep -q "cleanup-bridge" "$RUNNER_TEMP/root-cleanup-dry-run.txt"
          sudo --non-interactive test ! -e /var/lib/mini-docker
          sudo --non-interactive test ! -e /var/run/mini-docker

      - name: Remove isolated runtime paths
        if: always()
        run: |
          set -euo pipefail

          require_tmp_path() {
            case "$1" in
              /tmp/mini-docker-root-runtime|/tmp/mini-docker-root-runtime/*) ;;
              *)
                echo "::error::Refusing to clean unsafe path: $1"
                exit 1
                ;;
            esac
          }

          require_tmp_path "$STATE_BASE"
          require_tmp_path "$SMOKE_ROOTFS"

          sudo umount -R "$SMOKE_ROOTFS/dev/pts" 2>/dev/null || true
          sudo umount -R "$SMOKE_ROOTFS/dev" 2>/dev/null || true
          sudo umount -R "$SMOKE_ROOTFS/sys" 2>/dev/null || true
          sudo umount -R "$SMOKE_ROOTFS/proc" 2>/dev/null || true
          sudo rm -rf -- "$STATE_BASE"

      - name: Retain final tested-source checkpoint
        if: always()
        run: |
          set -euo pipefail
          mkdir -p verification/source-after
          cp --parents tests/test_linux_runtime_integration.py .github/workflows/root-runtime.yml \
            mini_docker/container.py mini_docker/filesystem.py \
            mini_docker/process_identity.py mini_docker/seccomp.py verification/source-after/
          sha256sum tests/test_linux_runtime_integration.py .github/workflows/root-runtime.yml \
            mini_docker/container.py mini_docker/filesystem.py \
            mini_docker/process_identity.py mini_docker/seccomp.py > verification/source-after.sha256
          sudo --non-interactive chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE/verification"

      - name: Upload runtime verification logs, XML and source checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: root-runtime-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: verification/
          retention-days: 14
          if-no-files-found: warn
          # Only the curated verification tree; includes its .github source copy.
          include-hidden-files: true
